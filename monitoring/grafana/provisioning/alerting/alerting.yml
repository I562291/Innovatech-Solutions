apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord-alerts
    receivers:
      - uid: discord-receiver
        type: discord
        settings:
          url: $DISCORD_WEBHOOK_URL
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: discord-alerts
    group_by: ['alertname']

groups:
  - orgId: 1
    name: innovatech-alerts
    folder: Innovatech
    interval: 1m
    rules:
      # 1. High CPU Alert (> 80% voor 2 minuten)
      - uid: alert-high-cpu
        title: High CPU Usage
        condition: B
        for: 2m
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100)
              instant: true
              range: false
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [80]
                    type: gt
              refId: B
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage op {{ $labels.instance }}"
          description: "CPU verbruik is boven de 80% voor meer dan 2 minuten."

      # 2. Service Failure Alert (Server of container is DOWN)
      - uid: alert-service-failure
        title: Service Failure (Instance Down)
        condition: B
        for: 1m
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: up == bool 0
              instant: true
              range: false
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              refId: B
        labels:
          severity: critical
        annotations:
          summary: "Service down: {{ $labels.instance }}"
          description: "Target {{ $labels.instance }} ({{ $labels.job }}) is al 1 minuut onbereikbaar!"

      # 3. Network Interface Down Alert
      - uid: alert-connectivity-issues
        title: Network Interface Down
        condition: B
        for: 2m
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: node_network_up{job="webservers",device!~"lo|docker.*"} == bool 0
              instant: true
              range: false
              refId: A
          - refId: B
            queryType: ''
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              refId: B
        labels:
          severity: warning
        annotations:
          summary: "Netwerkinterface down op {{ $labels.instance }}"
          description: "Een fysieke netwerkinterface op deze webserver is niet beschikbaar."