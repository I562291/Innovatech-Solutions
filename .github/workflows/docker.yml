name: docker pull

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "db_connection.py"
      - "requirements.txt"
      - "dockerfile"
      - "templates/**"
      - "nginx/**"

jobs:
  terraform:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: /

    steps:
      - uses: actions/checkout@v4

      - name: docker pull
        run: docker pull
