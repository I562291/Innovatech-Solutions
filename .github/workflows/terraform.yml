name: Terraform test

# on:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

jobs:
  terraform:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan

      - name: Terraform apply
        # run: terraform apply -target=aws_ecr_repository.container_registry -auto-approve
        run: terraform apply -auto-approve