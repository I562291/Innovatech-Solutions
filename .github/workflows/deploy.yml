  test-and-push:
    name: Application smoke test
    runs-on: self-hosted

    steps:
      # testing stage --------------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build -t innovatech-test:latest .

      - name: Start test container
        run: docker run -d --name innovatech-test -p 8080:80 innovatech-test:latest

      - name: Test home page
        # run: curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://localhost:8080/
        run: exit 1

      - name: delete test container if test passed or failed # we always want to delete the container, also if the test failed, to clean up the environment
        if: always()
        run: docker rm -f innovatech-test || true # hiermee verwijderen we alleen de container als die bestaat, zo voorkomen we een error

      # deployment stage ----------------------------------------------------------------------------
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region eu-central-1 \
          | docker login --username AWS --password-stdin 050670385147.dkr.ecr.eu-central-1.amazonaws.com

      - name: Tag application image
        run: docker tag innovatech-test:latest 050670385147.dkr.ecr.eu-central-1.amazonaws.com/container_registry:latest

      - name: Push application image # Image still has the whole repo code copied into it, even after removing the test container
        run: docker push 050670385147.dkr.ecr.eu-central-1.amazonaws.com/container_registry:latest

  instance-refresh:
    name: Refresh webserver instances
    runs-on: self-hosted
    # needs: [terraform, test-and-push]
    needs: test-and-push

    steps:
      - name: Refresh webserver instances
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name webserver-asg \
            --strategy Rolling \
            --preferences '{
              "MinHealthyPercentage": 50,
              "InstanceWarmup": 60,
              "SkipMatching": false
            }'