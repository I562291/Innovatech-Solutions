name: Monitoring deploy

# on:
#   push:
#     branches: [main]

on:
  workflow_dispatch:

jobs:
  terraform:
    runs-on: self-hosted

    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -replace="aws_instance.monitoring_server"

      - name: Terraform apply
        run: terraform apply -replace="aws_instance.monitoring_server" -auto-approve