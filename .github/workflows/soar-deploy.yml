name: Build and deploy SOAR

# on:
#   workflow_dispatch:
#   push:
#     paths:
#       - "soar/**" #
on: 
  workflow_dispatch:


jobs:
  build-and-deploy:
    runs-on: self-hosted
    env:
      AWS_REGION: eu-central-1
      ECR_REPOSITORY: soar_container_registry
      SOAR_ASG: soar-asg

    steps:
      - uses: actions/checkout@v4

      - name: Login to ECR
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> "$GITHUB_ENV"

      - name: Build and push SOAR image
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" soar
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Refresh SOAR instances
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$SOAR_ASG" \
            --strategy Rolling \
            --preferences '{"MinHealthyPercentage": 0,"InstanceWarmup": 60,"SkipMatching": false}'
