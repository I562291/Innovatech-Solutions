name: Weekly Ansible updates

# on:
#   schedule:
#     - cron: "0 2 * * 1"
#   workflow_dispatch:

on: 
    workflow_dispatch:

concurrency:
  group: ansible-weekly-updates
  cancel-in-progress: false

jobs:
  update:
    name: Update hosts
    runs-on: self-hosted

    steps:
      - name: Checkout repository # repo checkout
        uses: actions/checkout@v4

      # - name: Run Ansible updates
      #   env: 
      #     ANSIBLE_BECOME_PASS: ${{ secrets.ANSIBLE_SUDO_PASSWORD }}
      #   run: |
      #     set -Eeuo pipefail
      #     ansible-playbook \
      #       -i ansible/inventory.ini \
      #       ansible/playbook.yml
      - name: Test Ansible sudo
        env:
          ANSIBLE_SUDO_PASSWORD: ${{ secrets.ANSIBLE_SUDO_PASSWORD }}
        run: |
          ansible onpremise \
            -i ansible/inventory.ini \
            -m ansible.builtin.command \
            -a "whoami" \
            --become