name: Weekly Ansible updates

# on:
#   schedule:
#     - cron: "0 2 * * 1"
#   workflow_dispatch:

on: 
    workflow_dispatch:

concurrency:
  group: ansible-weekly-updates
  cancel-in-progress: false

jobs:
  update:
    name: Update hosts
    runs-on: self-hosted

    steps:
      - name: Checkout repository # repo checkout
        uses: actions/checkout@v4

      - name: Update SSH known_hosts
        run: |
          ssh-keygen -R soar.innovatech.internal || true
          ssh-keygen -R grafana.innovatech.internal || true
          ssh-keygen -R vpn.innovatech.internal || true

      - name: Run Ansible updates
        env: 
          ANSIBLE_SUDO_PASSWORD: ${{ secrets.ANSIBLE_SUDO_PASSWORD }}
          ANSIBLE_SSH_COMMON_ARGS: "-o StrictHostKeyChecking=accept-new" # hiermee kan ik ervoor zorgen dat de ssh key van de host automatisch wordt geaccepteerd
        run: |
          set -Eeuo pipefail
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/playbook.yml
      
