<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offboard | Innovatech Solutions</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #102b50, #091628);
        color: white;
        font-family: Arial, sans-serif;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 5%;
        background: #10233d;
        border-bottom: 1px solid #1e40af;
      }
      header h1 {
        margin: 0;
        color: #93c5fd;
        font-size: 1.3rem;
      }
      header a,
      button {
        padding: 10px 14px;
        border: 0;
        border-radius: 5px;
        background: #3b82f6;
        color: white;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      main {
        display: grid;
        place-items: center;
        padding: 40px 20px;
      }
      form {
        display: grid;
        gap: 12px;
        width: min(100%, 360px);
        padding: 24px;
        border: 1px solid #1e3a5f;
        border-radius: 8px;
        background: #10213a;
      }
      h2 {
        margin: 0 0 8px;
        color: #bfdbfe;
      }
      select {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #385477;
        border-radius: 5px;
        background: #091628;
        color: white;
        font: inherit;
      }
      select:focus {
        outline: 2px solid #60a5fa;
        outline-offset: 1px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Human Resources</h1>
      <a href="{{ url_for('hr') }}">Home</a>
    </header>
    <main>
      <form method="post" action="{{ url_for('offboard') }}">
        <h2>Offboard employee</h2>
        <label for="name">Select employee</label>
        <select id="name" name="name" required {% if not employees %}disabled{% endif %}>
          <option value="" selected disabled>Choose an employee</option>
          {% for employee in employees %}
          <option value="{{ employee[0] }}">{{ employee[0] }}</option>
          {% else %}
          <option disabled>No employees available</option>
          {% endfor %}
        </select>
        <button type="submit" {% if not employees %}disabled{% endif %}>Offboard</button>
      </form>
    </main>
  </body>
</html>
