<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovatech SOAR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        html, body {
            height: 100%;
        }

        body {
            background: #071a16;
            color: white;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #0b2922;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #164e3b;
        }

        header h1 {
            font-size: 24px;
        }

        nav a {
            color: #bbf7d0;
            text-decoration: none;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
            background: radial-gradient(circle at top, #166534 0%, #0f2922 45%, #071a16 100%);
        }

        .hero h2 {
            font-size: 56px;
            margin-bottom: 18px;
        }

        .hero p {
            font-size: 20px;
            color: #bbf7d0;
            margin-bottom: 32px;
        }

        .status {
            background: #14532d;
            border: 1px solid #4ade80;
            border-radius: 8px;
            padding: 15px 30px;
            color: #dcfce7;
            font-weight: bold;
        }

        footer {
            background: #0b2922;
            color: #86efac;
            text-align: center;
            padding: 20px;
            border-top: 1px solid #164e3b;
        }
    </style>
</head>
<body>
    <header>
        <h1>Innovatech SOAR</h1>
        <nav><a href="/health">Health check</a></nav>
    </header>
    <section class="hero">
        <h2>Security Orchestration</h2>
        <p>Centralized alert handling and automated incident response.</p>
        <div class="status">SOAR system online</div>
    </section>
    <footer><p>© 2026 Innovatech Solutions</p></footer>
</body>
</html>
