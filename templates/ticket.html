<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Ticket</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b1120;
            color: white;
        }

        header {
            background: #0f172a;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
        }

        header a {
            color: #cbd5e1;
            text-decoration: none;
        }

        .container {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ticket {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            width: 100%;
            max-width: 400px; /* Zorgt dat het formulier mooi compact blijft */
        }

        .ticket h1 {
            margin-bottom: 15px;
        }

        .ticket p {
            color: #94a3b8;
            margin-bottom: 25px;
        }

        /* Nieuwe stijl voor het invoerveld */
        .input-field {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            text-align: center;
        }

        .input-field:focus {
            border-color: #2563eb; /* Blauwe gloed bij selecteren */
        }

        .input-field::placeholder {
            color: #64748b; /* Subtiele kleur voor de placeholder */
        }

        /* Aangepaste knopstijl voor een formulier-button */
        .button {
            width: 100%;
            background: #2563eb;
            color: white;
            padding: 14px 28px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: inline-block;
            text-decoration: none;
        }

        .button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<header>
    <h2>Innovatech Solutions</h2>
    <a href="/">Home</a>
</header>

<div class="container">
    <div class="ticket">
        <h1>Tech Conference 2026</h1>
        <p>October 12, 2026 - €49.99</p>

        <!-- Formulier dat naar de confirmation pagina linkt -->
        <form action="/confirmation" method="POST">
            <input 
                type="text" 
                name="name" 
                class="input-field" 
                placeholder="Vul je naam in..." 
                required 
                autocomplete="off"
            >
            <button type="submit" class="button">Buy Ticket</button>
        </form>
    </div>
</div>

</body>
</html>
