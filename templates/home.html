<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovatech Solutions</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        html, body {
            height: 100%;
        }

        body {
            background: #0b1120;
            color: white;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #0f172a;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
        }

        header h1 {
            font-size: 24px;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: white;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
            background:
                radial-gradient(circle at top, #1e3a8a 0%, #0f172a 45%, #0b1120 100%);
        }

        .hero h2 {
            font-size: 56px;
            margin-bottom: 18px;
        }

        .hero p {
            font-size: 20px;
            color: #cbd5e1;
            margin-bottom: 32px;
        }

        .button {
            background: #2563eb;
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        footer {
            background: #0f172a;
            color: #94a3b8;
            text-align: center;
            padding: 20px;
            border-top: 1px solid #1e293b;
        }
    </style>
</head>

<body>

<header>
    <h1>Innovatech Solutions</h1>

    <nav>
        <a href="#">Home</a>
    </nav>
</header>

<section class="hero">
    <h2>Experience What's Next</h2>

    <p>
        Discover upcoming events and secure your tickets quickly and easily.
    </p>

    <a class="button" href="/ticket">Buy Tickets</a>
</section>

<footer>
    <p>© 2026 Innovatech Solutions</p>
</footer>

</body>
</html>
