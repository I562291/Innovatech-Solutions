- name: Update on-premise hosts
  hosts: onpremise
  become: true # run tasks as root
  serial: 1 # een server tegenlijk updaten, zodat er geen/minder downtime is
  any_errors_fatal: false
  tasks:
    - name: Wait for connection
      ansible.builtin.wait_for_connection:
        timeout: 10
    - name: Update and upgrade packages with APT
      ansible.builtin.apt:
        name: "*" # update all packages
        state: latest
        update_cache: true
        upgrade: dist

- name: Update AWS hosts
  hosts: aws
  become: true # run tasks as root
  serial: 1 # een server tegenlijk updaten, zodat er geen/minder downtime is
  any_errors_fatal: false
  tasks:
    - name: Wait for connection
      ansible.builtin.wait_for_connection:
        timeout: 10
    - name: Update and upgrade packages with DNF
      ansible.builtin.dnf:
        name: "*" # update all packages
        state: latest
        update_cache: true